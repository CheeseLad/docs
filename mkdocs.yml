theme:
  name: material
  font:
    text: Roboto
  logo: assets/avatar.png
  favicon: assets/avatar.png
  language: en
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: deep orange
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: deep orange
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.footer
  - navigation.tabs
  - navigation.top
plugins:
- search
- material-plausible
