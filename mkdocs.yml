theme:
  name: material
  font:
    text: Roboto
  logo: assets/avatar.png
  favicon: assets/avatar.png
  language: en
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: deep orange
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: deep orange
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.footer
  - navigation.tabs
  - navigation.top
plugins:
- search
- material-plausible
extra:
  social:
  - icon: fontawesome/solid/envelope
    link: mailto:jake_farrell@outlook.com
    name: Send me an email!
  - icon: fontawesome/brands/github
    link: https://github.com/CheeseLad
    name: Check out my GitHub!
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/in/jake-farrell-cs
    name: Connect with me on LinkedIn!
  - icon: fontawesome/brands/instagram
    link: https://www.instagram.com/jakefarrell2003
    name: Follow my Instagram!
  generator: false
  analytics:
    provider: plausible
    domain: docs.jakefarrell.ie
    src: https://pa.jakefarrell.ie/js/script.js
